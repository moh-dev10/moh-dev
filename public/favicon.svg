<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17191e" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Squircle container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.35" />
  
  <!-- Monogram M -->
  <text x="21" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter Tight', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-1">M</text>
  
  <!-- Tech Accent Dot -->
  <circle cx="48" cy="41" r="5" fill="#2563eb" filter="url(#glow)" />
</svg>
